<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a13">
<title>Тест по физике • 7 класс • Графики механического движения</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a13; --panel:#0c1424; --panel2:#101a30;
  --ink:#eaf2ff; --mut:#8fa3c8; --dim:#5a6c8f;
  --cyan:#22d3ee; --magenta:#f472b6; --lime:#a3e635; --amber:#fbbf24; --red:#fb7185;
  --line:rgba(120,160,255,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{min-height:100%}
body{
  font-family:"Rubik",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;min-height:100vh;
}
button{font-family:inherit;color:inherit}
/* ---------- фон: миллиметровка + дрейфующие свечения ---------- */
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   linear-gradient(rgba(90,140,255,.05) 1px,transparent 1px),
   linear-gradient(90deg,rgba(90,140,255,.05) 1px,transparent 1px),
   linear-gradient(rgba(90,140,255,.10) 1px,transparent 1px),
   linear-gradient(90deg,rgba(90,140,255,.10) 1px,transparent 1px);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px;
  -webkit-mask-image:radial-gradient(120% 90% at 50% 15%,#000 35%,transparent 100%);
          mask-image:radial-gradient(120% 90% at 50% 15%,#000 35%,transparent 100%);
}
.glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.g1{width:560px;height:560px;background:#0e7490;opacity:.33;top:-180px;left:-140px;animation:drift1 26s ease-in-out infinite alternate}
.g2{width:520px;height:520px;background:#9d174d;opacity:.26;bottom:-170px;right:-150px;animation:drift2 31s ease-in-out infinite alternate}
.g3{width:420px;height:420px;background:#713f12;opacity:.20;top:38%;left:58%;animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(140px,90px)}}
@keyframes drift2{to{transform:translate(-120px,-110px)}}
@keyframes drift3{to{transform:translate(-160px,70px)}}
/* ---------- каркас ---------- */
.wrap{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:26px 16px 60px}
.screen{animation:screenIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.panel{background:linear-gradient(180deg,rgba(16,24,44,.92),rgba(9,15,28,.95));
  border:1px solid var(--line);border-radius:20px;
  box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 44px rgba(56,130,246,.04)}
.foot{text-align:center;color:var(--dim);font-size:12.5px;margin-top:26px;letter-spacing:.05em}
/* ---------- стартовый экран ---------- */
.start-top{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin-bottom:18px}
.intro{padding:30px 26px}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.bchip{font:700 11px "JetBrains Mono",monospace;letter-spacing:.16em;padding:7px 12px;border-radius:999px;border:1px solid}
.bchip.c{color:var(--cyan);border-color:rgba(34,211,238,.4);box-shadow:0 0 12px rgba(34,211,238,.15)}
.bchip.a{color:var(--amber);border-color:rgba(251,191,36,.4);box-shadow:0 0 12px rgba(251,191,36,.12)}
.bchip.m{color:var(--magenta);border-color:rgba(244,114,182,.4);box-shadow:0 0 12px rgba(244,114,182,.12)}
.title{font-family:"Unbounded",sans-serif;font-weight:800;font-size:clamp(24px,4.6vw,38px);line-height:1.18;margin-bottom:14px}
.title .neon{color:var(--cyan);text-shadow:0 0 18px rgba(34,211,238,.65),0 0 46px rgba(34,211,238,.3)}
.topic{color:var(--mut);font-size:14.5px;line-height:1.55;margin-bottom:22px}
.teacher{border-left:3px solid var(--amber);padding:10px 14px;background:rgba(251,191,36,.06);border-radius:0 12px 12px 0;font-size:14.5px;color:#cfd9ee}
.teacher b{color:var(--amber)}
.formp{padding:26px 24px}
.formp h2{font-family:"Unbounded",sans-serif;font-size:17px;font-weight:600;margin-bottom:20px;letter-spacing:.02em}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:7px;font-weight:600}
.inp{width:100%;background:#0a1120;border:1.5px solid rgba(120,160,255,.22);border-radius:12px;color:var(--ink);
  padding:13px 14px;font-size:16px;outline:none;transition:border-color .25s,box-shadow .25s}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.14),0 0 18px rgba(34,211,238,.25)}
.selwrap{position:relative}
.selwrap::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--cyan);pointer-events:none;font-size:15px}
select.inp{appearance:none;-webkit-appearance:none;cursor:pointer}
.err{display:none;color:var(--red);font-size:13px;margin:-6px 0 10px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;border:none;border-radius:14px;
  padding:15px 24px;font-weight:700;font-size:15px;letter-spacing:.04em;cursor:pointer;transition:.25s}
.btn-primary{background:linear-gradient(135deg,#0891b2,#22d3ee);color:#04121a;box-shadow:0 6px 26px rgba(34,211,238,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 34px rgba(34,211,238,.5)}
.btn-primary:disabled{opacity:.35;filter:grayscale(.7);cursor:not-allowed;transform:none;box-shadow:none}
.attline{margin-top:12px;font:600 12.5px "JetBrains Mono",monospace;color:var(--amber);min-height:16px;letter-spacing:.03em}
/* декоративный график */
.decobox{padding:22px 20px;display:flex;flex-direction:column;justify-content:center}
.deco{width:100%;height:auto}
.dl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s ease forwards}
.dl.d2{animation-delay:.35s}.dl.d3{animation-delay:.7s}
@keyframes draw{to{stroke-dashoffset:0}}
.mover{width:11px;height:11px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 12px rgba(251,191,36,.9),0 0 28px rgba(251,191,36,.5);
  offset-path:path("M42,170 L322,32");animation:travel 4.4s linear 1.6s infinite}
@keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}
@supports not (offset-path:path("M0,0 L1,1")){.mover{display:none}}
/* ---------- дисклеймер ---------- */
.disc{padding:30px 26px;max-width:720px;margin:0 auto}
.disc h2{font-family:"Unbounded",sans-serif;font-size:21px;margin-bottom:20px}
.rules{display:grid;gap:11px;margin-bottom:22px}
.rule{display:flex;gap:12px;align-items:flex-start;background:rgba(10,17,32,.6);border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;font-size:14.5px;line-height:1.5;transition:.25s}
.rule:hover{border-color:rgba(34,211,238,.45);transform:translateX(4px)}
.rule .ic{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.28)}
.chkrow{display:flex;gap:12px;align-items:flex-start;background:rgba(34,211,238,.05);border:1.5px dashed rgba(34,211,238,.4);
  border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5;margin-bottom:18px;cursor:pointer}
.chkrow input{width:21px;height:21px;accent-color:var(--cyan);flex:0 0 21px;cursor:pointer;margin-top:1px}
/* ---------- тест ---------- */
.hud{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.qcount{font:700 13px "JetBrains Mono",monospace;color:var(--cyan);letter-spacing:.12em;white-space:nowrap;text-shadow:0 0 10px rgba(34,211,238,.5)}
.segs{display:flex;gap:5px;flex:1;min-width:60px}
.seg{height:6px;flex:1;border-radius:4px;background:rgba(120,160,255,.14);transition:.35s}
.seg.done{background:rgba(34,211,238,.5)}
.seg.cur{background:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.9);animation:segpulse 1.4s infinite}
@keyframes segpulse{50%{box-shadow:0 0 18px rgba(34,211,238,1)}}
.timer{position:relative;flex:0 0 56px;width:56px;height:56px}
.ring{width:56px;height:56px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(120,160,255,.15);stroke-width:5}
.ring-fg{fill:none;stroke:var(--cyan);stroke-width:5;stroke-linecap:round;stroke-dasharray:157.08;transition:stroke-dashoffset .22s linear,stroke .4s}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font:700 15px "JetBrains Mono",monospace;color:var(--cyan)}
.timer.warn .ring-fg{stroke:var(--amber)}.timer.warn .tnum{color:var(--amber)}
.timer.bad .ring-fg{stroke:var(--red)}.timer.bad .tnum{color:var(--red);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.qcard{padding:24px 22px 26px;transition:opacity .24s,transform .24s}
.qcard.qleave{opacity:0;transform:translateX(-28px)}
.qcard.qenter{animation:qin .34s cubic-bezier(.2,.8,.25,1)}
@keyframes qin{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.chip{font:700 10.5px "JetBrains Mono",monospace;letter-spacing:.18em;padding:6px 11px;border-radius:999px;border:1px solid}
.chip.theory{color:var(--cyan);border-color:rgba(34,211,238,.45)}
.chip.graph{color:var(--magenta);border-color:rgba(244,114,182,.45)}
.chip.calc{color:var(--lime);border-color:rgba(163,230,53,.45)}
.chip.gcalc{color:var(--amber);border-color:rgba(251,191,36,.45)}
.chip.score{color:var(--dim);border-color:var(--line);letter-spacing:.1em}
.qtext{font-size:18px;font-weight:600;line-height:1.5;margin-bottom:16px;user-select:none}
.qfigure{display:flex;justify-content:center;margin:4px 0 18px}
.qfigure svg{max-width:520px;width:100%;height:auto}
.figminis{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:4px 0 18px}
.mini{flex:1 1 150px;max-width:220px;background:rgba(8,14,28,.55);border:1px solid var(--line);border-radius:14px;padding:10px 8px 6px;transition:.25s}
.mini:hover{border-color:rgba(244,114,182,.5);box-shadow:0 0 16px rgba(244,114,182,.15)}
.mini svg{width:100%;height:auto}
.minicap{text-align:center;font:700 14px "JetBrains Mono",monospace;color:var(--magenta);padding:5px 0 3px;text-shadow:0 0 10px rgba(244,114,182,.6)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:rgba(10,17,32,.7);
  border:1.5px solid rgba(120,160,255,.18);border-radius:14px;padding:13px 15px;color:var(--ink);
  font-size:15.5px;line-height:1.45;cursor:pointer;transition:.2s;user-select:none}
.opt:hover{border-color:rgba(34,211,238,.55);transform:translateX(4px)}
.opt .key{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font:700 13px "JetBrains Mono",monospace;background:rgba(34,211,238,.1);color:var(--cyan);border:1px solid rgba(34,211,238,.3);transition:.2s}
.opt.sel{border-color:var(--cyan);background:rgba(34,211,238,.08);animation:selPulse 1.8s ease-in-out infinite}
.opt.sel .key{background:var(--cyan);color:#04121a;box-shadow:0 0 12px rgba(34,211,238,.8)}
@keyframes selPulse{
 0%,100%{box-shadow:0 0 0 1px rgba(34,211,238,.7),0 0 16px rgba(34,211,238,.3),inset 0 0 16px rgba(34,211,238,.06)}
 50%{box-shadow:0 0 0 1px rgba(34,211,238,.95),0 0 30px rgba(34,211,238,.55),inset 0 0 22px rgba(34,211,238,.1)}}
.ansrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ans{width:180px;background:#0a1120;border:1.5px solid rgba(120,160,255,.25);border-radius:12px;color:#fff;
  font:700 20px "JetBrains Mono",monospace;padding:12px 14px;text-align:center;outline:none;transition:.25s}
.ans:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(163,230,53,.14),0 0 20px rgba(163,230,53,.3)}
.unit{font:600 15px "JetBrains Mono",monospace;color:var(--mut)}
.hint{font-size:13px;color:var(--mut);margin-top:11px}
.next{margin-top:20px;width:100%;padding:16px;border-radius:14px;border:1.5px solid rgba(120,160,255,.2);
  background:rgba(10,17,32,.6);color:#4d5f85;font-weight:700;font-size:15px;letter-spacing:.1em;
  text-transform:uppercase;cursor:not-allowed;transition:.3s}
.next.armed{cursor:pointer;color:#04121a;background:linear-gradient(135deg,#06b6d4,#67e8f9);border-color:transparent;
  animation:armPulse 1.5s infinite}
@keyframes armPulse{
 0%,100%{box-shadow:0 0 18px rgba(34,211,238,.5),0 0 50px rgba(34,211,238,.2)}
 50%{box-shadow:0 0 32px rgba(34,211,238,.9),0 0 90px rgba(34,211,238,.4)}}
/* ---------- модал предупреждения ---------- */
.overlay{position:fixed;inset:0;background:rgba(3,6,14,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:60;opacity:0;pointer-events:none;transition:.3s}
.overlay.on{opacity:1;pointer-events:auto}
.modal{max-width:430px;width:calc(100% - 40px);padding:30px 24px;text-align:center;
  border:1.5px solid rgba(251,191,36,.55);box-shadow:0 0 46px rgba(251,191,36,.28),0 20px 60px rgba(0,0,0,.6);
  background:linear-gradient(180deg,rgba(20,26,44,.97),rgba(10,15,28,.98))}
.modal .wi{font-size:46px;display:block;margin-bottom:12px;filter:drop-shadow(0 0 16px rgba(251,191,36,.8))}
.modal h3{font-family:"Unbounded",sans-serif;font-size:19px;color:var(--amber);margin-bottom:12px}
.modal p{font-size:14.5px;line-height:1.55;color:#d4def2;margin-bottom:20px}
.modal .btn{width:100%;background:linear-gradient(135deg,#d97706,#fbbf24);color:#1c1204}
/* ---------- результат ---------- */
.res{padding:34px 26px;max-width:640px;margin:0 auto;text-align:center}
.res h2{font-family:"Unbounded",sans-serif;font-size:clamp(19px,3.6vw,24px);margin-bottom:6px}
.res .rstatus{font-size:13.5px;margin-bottom:26px;font-weight:600;letter-spacing:.04em}
.rstatus.ok{color:var(--cyan)} .rstatus.bad{color:var(--red)}
.scorebig{font-family:"Unbounded",sans-serif;font-weight:800;font-size:clamp(52px,10vw,74px);line-height:1;margin-bottom:6px}
.scorebig span{color:var(--cyan);text-shadow:0 0 24px rgba(34,211,238,.7),0 0 70px rgba(34,211,238,.35)}
.scorebig .of{font-size:.42em;color:var(--mut);text-shadow:none;font-weight:600}
.scorebar{height:10px;border-radius:6px;background:rgba(120,160,255,.12);overflow:hidden;margin:14px auto 8px;max-width:420px}
.scorebar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#06b6d4,#67e8f9);
  box-shadow:0 0 16px rgba(34,211,238,.8);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.verdict{font-size:16px;font-weight:700;margin:14px 0 24px;letter-spacing:.02em}
.v-exc{color:var(--lime);text-shadow:0 0 14px rgba(163,230,53,.6)}
.v-good{color:var(--cyan);text-shadow:0 0 14px rgba(34,211,238,.6)}
.v-mid{color:var(--amber);text-shadow:0 0 14px rgba(251,191,36,.6)}
.v-low{color:var(--red)}
.meta{display:grid;gap:8px;margin-bottom:22px;text-align:left}
.mrow{display:flex;justify-content:space-between;gap:14px;padding:11px 15px;background:rgba(10,17,32,.6);
  border:1px solid var(--line);border-radius:12px;font-size:14px}
.mrow span{color:var(--mut)} .mrow b{color:var(--ink);text-align:right;font-weight:600}
.mrow.hl b{color:var(--cyan)}
.sendline{font-size:13px;color:var(--mut);margin-top:14px;line-height:1.5}
@media (max-width:820px){.start-top{grid-template-columns:1fr}}
@media (max-width:560px){
  .wrap{padding:18px 12px 50px}
  .intro,.formp,.disc,.res{padding:22px 16px}
  .qcard{padding:20px 15px 22px}
  .qtext{font-size:16.5px}
  .qcount{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<main id="app"></main>

<div class="overlay" id="warnModal">
  <div class="modal panel">
    <span class="wi">⚠️</span>
    <h3>Внимание! Зафиксировано нарушение</h3>
    <p>Вы свернули вкладку или открыли другое окно поверх теста.<br><br>
    При <b>повторном</b> нарушении тест будет завершён автоматически, а попытка будет засчитана.</p>
    <button class="btn" id="warnOk" type="button">Понятно, продолжаю тест</button>
  </div>
</div>

<script>
/* =====================================================================
   ОТПРАВКА В GOOGLE ТАБЛИЦУ:
   1) Создайте таблицу → Расширения → Apps Script
   2) Вставьте код из файла Code.gs (прилагается) → Развернуть →
      Веб-приложение (Выполнять: от моего имени, Доступ: Все)
   3) Скопированный URL вставьте в константу ниже.
===================================================================== */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxgwZf7qZ5u2a0r00PudQsVMqxboxEXcsfGkfeT2XeHY9Gp1chpnWBoqRdyfwgiVESfQQ/exec"; // ← сюда вставить URL веб-приложения

const TEACHER = "Кунгозин Даулет Багдашұлы";
const QTIME = 90; // секунд на вопрос
const KEYS = ["А","Б","В","Г"];

/* ================= ПОСТРОИТЕЛЬ ГРАФИКОВ (сетка «в клетку», оси с величинами) ================= */
const CELL=22, ML=44, MR=40, MT=30, MB=36;
function graphSVG(o){
  const W=ML+o.nx*CELL+MR, H=MT+o.ny*CELL+MB, ox=ML, oy=MT+o.ny*CELL;
  const X=u=>Math.round((ox+u/o.xStep*CELL)*10)/10;
  const Y=u=>Math.round((oy-u/o.yStep*CELL)*10)/10;
  const P=[];
  P.push('<svg class="graph" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">');
  for(let i=0;i<=o.nx;i++){const x=ox+i*CELL;P.push('<line x1="'+x+'" y1="'+MT+'" x2="'+x+'" y2="'+oy+'" stroke="rgba(120,170,255,'+(i%5?'.10':'.20')+')" stroke-width="1"/>');}
  for(let j=0;j<=o.ny;j++){const y=oy-j*CELL;P.push('<line x1="'+ox+'" y1="'+y+'" x2="'+(ox+o.nx*CELL)+'" y2="'+y+'" stroke="rgba(120,170,255,'+(j%5?'.10':'.20')+')" stroke-width="1"/>');}
  P.push('<line x1="'+ox+'" y1="'+oy+'" x2="'+(ox+o.nx*CELL+12)+'" y2="'+oy+'" stroke="#c9dcff" stroke-width="1.6"/>');
  P.push('<polygon points="'+(ox+o.nx*CELL+20)+','+oy+' '+(ox+o.nx*CELL+10)+','+(oy-4.5)+' '+(ox+o.nx*CELL+10)+','+(oy+4.5)+'" fill="#c9dcff"/>');
  P.push('<line x1="'+ox+'" y1="'+oy+'" x2="'+ox+'" y2="'+(MT-10)+'" stroke="#c9dcff" stroke-width="1.6"/>');
  P.push('<polygon points="'+ox+','+(MT-18)+' '+(ox-4.5)+','+(MT-8)+' '+(ox+4.5)+','+(MT-8)+'" fill="#c9dcff"/>');
  for(let i=1;i<=o.nx;i++){const x=ox+i*CELL;
    P.push('<line x1="'+x+'" y1="'+(oy-3.5)+'" x2="'+x+'" y2="'+(oy+3.5)+'" stroke="#c9dcff" stroke-width="1.2"/>');
    if(i%o.xNum===0)P.push('<text x="'+x+'" y="'+(oy+17)+'" text-anchor="middle" fill="#9db4dc" font-family="JetBrains Mono,monospace" font-size="10.5">'+(i*o.xStep)+'</text>');}
  for(let j=1;j<=o.ny;j++){const y=oy-j*CELL;
    P.push('<line x1="'+(ox-3.5)+'" y1="'+y+'" x2="'+(ox+3.5)+'" y2="'+y+'" stroke="#c9dcff" stroke-width="1.2"/>');
    if(j%o.yNum===0)P.push('<text x="'+(ox-7)+'" y="'+(y+3.5)+'" text-anchor="end" fill="#9db4dc" font-family="JetBrains Mono,monospace" font-size="10.5">'+(j*o.yStep)+'</text>');}

const C1='#22d3ee', C2='#f472b6', C3='#a3e635';
const MINI={
  const:{series:[{c:C1,pts:[[0,3],[5,3]]}]},
  up:{series:[{c:C1,pts:[[0,0],[5,4]]}]},

function miniSpec(m){return Object.assign({nx:5,ny:4,xStep:1,yStep:1,xNum:1,yNum:1,xLab:'t, с',yLab:'υ, м/с'},MINI[m]);}
function bigSpec(f){
  if(f.kind==='cmp'){const cols=[C1,C2,C3];
    return {nx:8,ny:9,xStep:1,yStep:5,xNum:1,yNum:2,xLab:'t, с',yLab:'s, м',
      series:f.lines.map((L,i)=>({c:cols[i],pts:[[0,0],[8,L]]})),
      tags:f.lines.map((L,i)=>({u:[8,L],t:String(i+1),c:cols[i],dx:8,dy:-8}))};}
  if(f.kind==='seg'){
    return {nx:f.nx,ny:f.ny,xStep:1,yStep:f.yStep,xNum:f.xNum||1,yNum:f.yNum||1,xLab:'t, с',yLab:'s, м',
      series:[{c:C1,pts:f.pts}],dots:f.pts,
      tags:f.pts.map((p,i)=>({u:p,t:f.names[i],c:'#ffd166',dx:f.tdx[i],dy:f.tdy[i]}))};}
  if(f.kind==='line'){
    return {nx:f.nx,ny:f.ny,xStep:1,yStep:f.yStep||5,xNum:1,yNum:f.yNum||1,xLab:'t, с',yLab:'s, м',
      series:[{c:C1,pts:[[0,0],f.to]}],dots:[f.to]};}
  if(f.kind==='hline'){
    return {nx:f.tEnd+1,ny:f.v+1,xStep:1,yStep:1,xNum:1,yNum:1,xLab:'t, с',yLab:'υ, м/с',
      series:[{c:C1,pts:[[0,f.v],[f.tEnd,f.v]]}],dots:[[f.tEnd,f.v]]};}
  return {nx:1,ny:1,xStep:1,yStep:1,xNum:1,yNum:1,xLab:'',yLab:'',series:[]};
}
function buildFigure(q){

}

function updateHud(){

function beginQuestion(i){
  state.qIndex=i;state.sel=null;state.numVal=null;
  state.deadline=Date.now()+QTIME*1000;
  renderQuestion();updateHud();
  clearInterval(state.timerId);state.timerId=setInterval(tick,220);tick();
}
function tick(){
  if(!state.running)return;
  const rem=Math.max(0,(state.deadline-Date.now())/1000);
  const tn=$('#tnum');if(!tn)return;
  tn.textContent=Math.ceil(rem);
  $('#tfg').style.strokeDashoffset=String(157.08*(1-rem/QTIME));
  const tw=$('#tw');
  tw.classList.toggle('warn',rem<=30&&rem>12);
  tw.classList.toggle('bad',rem<=12);
  if(rem<=0){clearInterval(state.timerId);state.timerId=0;state.answers.push(null);advance();}
}

    body='<div class="ansrow"><input class="ans" id="ans" type="text" inputmode="decimal" autocomplete="off" placeholder="?" aria-label="Ответ">'
      +(q.unit?'<span class="unit">'+q.unit+'</span>':'')+'</div>'
      +'<p class="hint">Введите ответ числом, без единиц измерения. Дробную часть можно отделять запятой.</p>';
  }
  $('#qslot').innerHTML=`
  <section class="panel qcard qenter" id="qcard">
    <div class="qhead"><span class="chip ${q.cls}">${q.chip}</span><span class="chip score">1 БАЛЛ</span></div>
    <p class="qtext">${q.t}</p>
    ${buildFigure(q)}
    ${body}
    <button class="next" id="nextBtn" type="button">${state.qIndex===9?'Завершить тест':'Далее →'}</button>
  </section>`;
  $('#nextBtn').addEventListener('click',()=>{
    if($('#nextBtn').classList.contains('armed'))submitCurrent();});
  if(q.type==='mc'){
    $$('.opt').forEach(b=>b.addEventListener('click',()=>{
      $$('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');state.sel=Number(b.dataset.i);armNext(true);}));
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>{state.numVal=parseNum(inp.value);armNext(state.numVal!==null);});
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&$('#nextBtn').classList.contains('armed'))submitCurrent();});
  }
}
function armNext(on){$('#nextBtn').classList.toggle('armed',on);$('#nextBtn').disabled=!on;}
function submitCurrent(){
  if(!state.running)return;
  const q=cur();let ok=false,given=null;
  if(q.type==='mc'){given=state.sel;ok=given===q.correct;}
  else{given=state.numVal;ok=given!==null&&Math.abs(given-q.correct)<1e-6;}
  state.answers.push(given);if(ok)state.score++;
  advance();
}
function advance(){
  if(!state.running)return;
  const card=$('#qcard');if(card)card.classList.add('qleave');
  setTimeout(()=>{
    if(!state.running)return;
    if(state.qIndex+1>=10)finish('done');else beginQuestion(state.qIndex+1);
  },240);
}

/* ================= АНТИЧИТ =================
   События: смена вкладки/приложения (видимость), потеря фокуса окном,
   сильное «усыхание» окна снизу (второе окно/панель).
   Ложные срабатывания исключены: при открытии ЦИФРОВОЙ КЛАВИАТУРЫ
   (активен текстовый ввод), при повороте экрана и мелких доводках размера. */
function violation(){
  if(!state.running||state.finished)return;
  const now=Date.now();
  if(now-lastViolAt<1500)return;
  lastViolAt=now;
  state.violations++;
  if(state.violations===1){pauseTimer();$('#warnModal').classList.add('on');}
  else finish('cheat');
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')violation();});
window.addEventListener('blur',()=>{
  setTimeout(()=>{
    if(!state.running||document.hidden)return;
    const ae=document.activeElement;
    if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'))return; // клавиатура / элементы формы
    violation();
  },320);});
window.addEventListener('orientationchange',()=>{orientAt=Date.now();});
window.addEventListener('resize',()=>{
  const h=innerHeight,shrunk=h<lastH*0.75;lastH=h;
  if(!shrunk||!state.running)return;
  if(Date.now()-orientAt<1200)return;                                   // поворот экрана
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;       // цифровая клавиатура
  violation();
});
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&state.running)violation();});

function pauseTimer(){
  if(!state.timerId)return;
  clearInterval(state.timerId);state.timerId=0;
  state.pausedRemain=Math.max(0,(state.deadline-Date.now())/1000);
}
function resumeTimer(){
  if(state.pausedRemain===null)return;
  state.deadline=Date.now()+state.pausedRemain*1000;state.pausedRemain=null;lastH=innerHeight;
  clearInterval(state.timerId);state.timerId=setInterval(tick,220);tick();
}
$('#warnOk').addEventListener('click',()=>{
  $('#warnModal').classList.remove('on');resumeTimer();});

/* ================= ЗАВЕРШЕНИЕ И РЕЗУЛЬТАТ ================= */
function finish(reason){
  if(state.finished)return;
  state.finished=true;state.running=false;
  clearInterval(state.timerId);state.timerId=0;
  $('#warnModal').classList.remove('on');
  const cheat=reason==='cheat';
  const payload={ts:Date.now(),fio:state.fio,klass:state.klass,
    variant:'Вариант '+state.variant,score:state.score,max:10,
    attempts:state.attempts,violations:state.violations,
    status:cheat?'Завершён досрочно (нарушение)':'Завершён'};
  sendToSheet(payload).then(ok=>{
    const el=$('#sendline');
    if(el)el.innerHTML=ok?'✅ Результат передан учителю в журнал (может обновиться в течение минуты).'
      :'ℹ️ Результат сохранён на этом устройстве.';});
  renderResult(cheat,payload);
}
function renderResult(cheat,p){
  const s=p.score;
  let verdict,vc;
  if(s>=9){verdict='Отлично! Так держать! 🏆';vc='v-exc';}
  else if(s>=7){verdict='Хороший результат! 👍';vc='v-good';}
  else if(s>=5){verdict='Удовлетворительно. Есть над чем поработать.';vc='v-mid';}
  else{verdict='Стоит повторить тему и попробовать ещё раз.';vc='v-low';}
  $('#app').innerHTML=`
  <div class="wrap screen"><section class="panel res">
    <h2>${cheat?'Тест завершён досрочно':'Тест завершён'}</h2>
    <p class="rstatus ${cheat?'bad':'ok'}">${cheat?'⚠ Зафиксировано повторное нарушение режима окна':'✓ Все вопросы обработаны'}</p>
    <div class="scorebig"><span id="scoreNum">0</span><span class="of"> / 10</span></div>
    <div class="scorebar"><i id="scorefill"></i></div>
    <p class="verdict ${vc}">${verdict}</p>
    <div class="meta">
      <div class="mrow"><span>Ученик</span><b>${p.fio}</b></div>
      <div class="mrow"><span>Класс</span><b>${p.klass}</b></div>
      <div class="mrow"><span>Вариант</span><b>${p.variant}</b></div>
      <div class="mrow hl"><span>Набрано баллов</span><b>${p.score} из 10</b></div>
      <div class="mrow"><span>Попыток использовано</span><b>${p.attempts}</b></div>
      <div class="mrow"><span>Нарушений режима</span><b>${p.violations}</b></div>
      <div class="mrow"><span>Статус</span><b>${p.status}</b></div>
    </div>
    <button class="btn btn-primary" id="again" type="button">Пройти ещё раз ↻</button>
    <p class="sendline" id="sendline">⏳ Отправляем результат учителю…</p>
  </section>
  <p class="foot">Учитель физики: ${TEACHER}</p></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#scorefill').style.width=(s*10)+'%';}));
  let n=0;const el=$('#scoreNum');
  const iv=setInterval(()=>{n++;el.textContent=n;if(n>=s)clearInterval(iv);},90);
  if(s===0)el.textContent='0';
  $('#again').addEventListener('click',renderStart);
}

/* ================= ОТПРАВКА В GOOGLE SHEETS ================= */
function saveLocal(p){try{
  const log=JSON.parse(localStorage.getItem('phys7_log')||'[]');
  log.push(p);localStorage.setItem('phys7_log',JSON.stringify(log.slice(-100)));}catch(e){}}
async function sendToSheet(p){
  saveLocal(p);
  if(!SHEET_URL||SHEET_URL.indexOf('ВСТАВЬТЕ')===0)return false;
  try{
    await fetch(SHEET_URL,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
    return true;
  }catch(e){return false;}
}
renderStart();
</script>
</body>
